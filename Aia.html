<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全身モーショントラッカー</title>
<style>
:root{--bg:#f4f5f7;--fg:#1a1d23;--card:#fff;--accent:#0a84ff;--mut:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--fg:#e8eaf0;--card:#1a1d26;--mut:#9aa1b0}}
:root[data-theme="dark"]{--bg:#0e1015;--fg:#e8eaf0;--card:#1a1d26;--mut:#9aa1b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:12px;max-width:720px;margin-inline:auto}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px}
.stage{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:10px;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mirror{transform:scaleX(-1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
button.sub{background:var(--card);color:var(--fg);border:1px solid var(--mut)}
#status{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.grid b{color:var(--accent)}
#v3{width:100%;height:240px;display:block;border-radius:10px;background:var(--bg)}
input[type=range]{width:100%}
</style>
</head>
<body>
<h1>全身モーショントラッカー</h1>
<div class="card">
  <div class="stage">
    <video id="vid" playsinline muted></video>
    <canvas id="ov"></canvas>
  </div>
  <div class="row">
    <button id="go">カメラ開始</button>
    <button id="flip" class="sub">前/背面切替</button>
    <span id="status">待機中</span>
  </div>
</div>
<div class="card">
  <div class="grid">
    <div>左ひじ <b id="a0">–</b></div><div>右ひじ <b id="a1">–</b></div>
    <div>左ひざ <b id="a2">–</b></div><div>右ひざ <b id="a3">–</b></div>
    <div>左肩 <b id="a4">–</b></div><div>右肩 <b id="a5">–</b></div>
    <div>FPS <b id="fps">–</b></div><div>検出点 <b id="cnt">–</b></div>
  </div>
</div>
<div class="card">
  <canvas id="v3"></canvas>
  <label style="font-size:13px;color:var(--mut)">3Dビューの回転</label>
  <input type="range" id="yaw" min="-180" max="180" value="0">
</div>
<p style="font-size:12px;color:var(--mut)">全身が映るよう2〜3m離れて撮影してください。映像は端末外に送信されず、ブラウザ内で処理されます。</p>

<script type="module">
import {PoseLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);
const vid=$("vid"),ov=$("ov"),ctx=ov.getContext("2d"),v3=$("v3"),c3=v3.getContext("2d");
let landmarker=null,facing="user",stream=null,running=false,last=0,fps=0;
const status=t=>$("status").textContent=t;
const CONN=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[27,31],[28,30],[30,32],[28,32],[15,17],[15,19],[15,21],[16,18],[16,20],[16,22],[0,11],[0,12]];

async function loadModel(){
  status("モデル読み込み中…");
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const url="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  const mk=d=>PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:url,delegate:d},runningMode:"VIDEO",numPoses:1});
  try{landmarker=await mk("GPU")}catch(e){landmarker=await mk("CPU")}
}
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:960},height:{ideal:1280}},audio:false});
  vid.srcObject=stream;await vid.play();
  const m=facing==="user";vid.classList.toggle("mirror",m);ov.classList.toggle("mirror",m);
}
$("go").onclick=async()=>{
  try{
    if(!landmarker)await loadModel();
    await startCam();
    if(!running){running=true;loop()}
    status("トラッキング中");$("go").textContent="再開始";
  }catch(e){status("エラー: "+(e.message||e)+"(カメラ許可/ネットワークを確認)")}
};
$("flip").onclick=async()=>{facing=facing==="user"?"environment":"user";if(stream)try{await startCam()}catch(e){status("切替失敗")}};

const ang=(a,b,c)=>{const u=[a.x-b.x,a.y-b.y,a.z-b.z],v=[c.x-b.x,c.y-b.y,c.z-b.z];
  const d=u[0]*v[0]+u[1]*v[1]+u[2]*v[2],n=Math.hypot(...u)*Math.hypot(...v);
  return n?Math.round(Math.acos(Math.max(-1,Math.min(1,d/n)))*180/Math.PI):null};

function loop(){
  requestAnimationFrame(loop);
  if(!landmarker||vid.readyState<2||vid.paused)return;
  const now=performance.now();
  if(ov.width!==vid.videoWidth){ov.width=vid.videoWidth;ov.height=vid.videoHeight}
  const res=landmarker.detectForVideo(vid,now);
  const dt=now-last;last=now;fps=fps*.9+(1000/dt)*.1;$("fps").textContent=fps.toFixed(0);
  ctx.clearRect(0,0,ov.width,ov.height);
  const L=res.landmarks[0],W=res.worldLandmarks[0];
  if(!L){$("cnt").textContent="0";draw3d(null);return}
  const vis=L.filter(p=>(p.visibility??1)>.5).length;$("cnt").textContent=vis+"/33";
  ctx.lineWidth=Math.max(3,ov.width/200);ctx.strokeStyle="#00e0a0";
  for(const[a,b]of CONN){if((L[a].visibility??1)<.4||(L[b].visibility??1)<.4)continue;
    ctx.beginPath();ctx.moveTo(L[a].x*ov.width,L[a].y*ov.height);ctx.lineTo(L[b].x*ov.width,L[b].y*ov.height);ctx.stroke()}
  ctx.fillStyle="#ff4d6d";
  L.forEach((p,i)=>{if(i>10&&(p.visibility??1)>.4){ctx.beginPath();ctx.arc(p.x*ov.width,p.y*ov.height,ctx.lineWidth*1.3,0,7);ctx.fill()}});
  const A=[[11,13,15],[12,14,16],[23,25,27],[24,26,28],[13,11,23],[14,12,24]];
  A.forEach((t,i)=>{const v=ang(W[t[0]],W[t[1]],W[t[2]]);$("a"+i).textContent=v==null?"–":v+"°"});
  draw3d(W);
}
function draw3d(W){
  const r=devicePixelRatio||1,w=v3.clientWidth,h=v3.clientHeight;
  if(v3.width!==w*r){v3.width=w*r;v3.height=h*r}
  c3.setTransform(r,0,0,r,0,0);c3.clearRect(0,0,w,h);
  if(!W)return;
  const th=$("yaw").value*Math.PI/180,cs=Math.cos(th),sn=Math.sin(th),s=h*.5;
  const P=W.map(p=>[w/2+(p.x*cs+p.z*sn)*s,h/2+p.y*s*.95,-p.x*sn+p.z*cs]);
  c3.lineWidth=3;c3.lineCap="round";c3.strokeStyle="#0a84ff";
  for(const[a,b]of CONN){c3.beginPath();c3.moveTo(P[a][0],P[a][1]);c3.lineTo(P[b][0],P[b][1]);c3.stroke()}
  c3.fillStyle="#ff4d6d";
  P.forEach((p,i)=>{if(i>10){c3.beginPath();c3.arc(p[0],p[1],3.5,0,7);c3.fill()}});
}
</script>
</body>
</html>
