<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全身モーショントラッカー</title>
<style>
:root{--bg:#f4f5f7;--fg:#1a1d23;--card:#fff;--accent:#0a84ff;--mut:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--fg:#e8eaf0;--card:#1a1d26;--mut:#9aa1b0}}
:root[data-theme="dark"]{--bg:#0e1015;--fg:#e8eaf0;--card:#1a1d26;--mut:#9aa1b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:12px;max-width:720px;margin-inline:auto}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px}
.stage{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:10px;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mirror{transform:scaleX(-1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
button.sub{background:var(--card);color:var(--fg);border:1px solid var(--mut)}
#status{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.grid b{color:var(--accent)}
#v3{width:100%;height:340px;display:block;border-radius:10px;background:var(--bg)}
input[type=range]{width:100%}
label{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<h1>全身モーショントラッカー</h1>
<div class="card">
  <div class="stage"><video id="vid" playsinline muted></video><canvas id="vc" hidden></canvas><canvas id="ov"></canvas></div>
  <div class="row">
    <button id="go">カメラ開始</button>
    <button id="flip" class="sub">前/背面切替</button>
    <span id="status">待機中</span>
  </div>
  <div class="row"><label>VRM: <input type="file" id="vf" accept=".vrm"></label></div>
  <div class="row">
    <label><input type="checkbox" id="dim"> 映像を暗くする</label>
    <label><input type="checkbox" id="sk" checked> 骨格線を表示</label>
  </div>
</div>
<div class="card">
  <canvas id="v3"></canvas>
  <label>3Dアバターの回転</label>
  <input type="range" id="yaw" min="-180" max="180" value="0">
  <label><input type="checkbox" id="mir" checked> 鏡のように表示</label>
</div>
<div class="card">
  <div class="grid">
    <div>左ひじ <b id="a0">–</b></div><div>右ひじ <b id="a1">–</b></div>
    <div>左ひざ <b id="a2">–</b></div><div>右ひざ <b id="a3">–</b></div>
    <div>顔 左右 <b id="fy">–</b></div><div>顔 上下 <b id="fp">–</b></div>
    <div>顔 傾き <b id="fr">–</b></div><div>手の検出 <b id="hd">–</b></div>
    <div>FPS <b id="fps">–</b></div><div>体の検出点 <b id="cnt">–</b></div>
  </div>
</div>
<p style="font-size:12px;color:var(--mut)">全身が映るよう2〜3m離れて撮影してください。画面外や未検出の部位は、基本姿勢(テンプレ)へゆっくり戻ります。映像は端末内で処理されます。</p>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"}}</script>
<script type="module">
import {PoseLandmarker,HandLandmarker,FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);
const vid=$("vid"),ov=$("ov"),ctx=ov.getContext("2d"),v3=$("v3"),c3=v3.getContext("2d");
let pose=null,handM=null,faceM=null,facing="user",stream=null,running=false,last=0,fps=0,n=0,handR=null,faceR=null;
const status=t=>$("status").textContent=t;

// ---- 調整用パラメータ ----
const FOLLOW=18;   // 検出値への追従(大きいほど速い/ブレやすい)
const RISE=6;      // テンプレ→検出ポーズへ移る速さ(1/秒)
const FALL=.35;    // 検出→テンプレへ戻る速さ(1/秒, .35≒約3秒)

// ---- 素体テンプレ(腰中心・単位m・y下向き・z奥向き) ----
const T=[[0,-.66,-.06],[.02,-.69,-.05],[.05,-.69,-.05],[.08,-.68,-.04],[-.02,-.69,-.05],[-.05,-.69,-.05],[-.08,-.68,-.04],[.10,-.66,.02],[-.10,-.66,.02],[.03,-.60,-.05],[-.03,-.60,-.05],[.19,-.50,0],[-.19,-.50,0],[.22,-.24,0],[-.22,-.24,0],[.23,-.01,0],[-.23,-.01,0],[.25,.04,0],[-.25,.04,0],[.23,.06,-.02],[-.23,.06,-.02],[.21,.03,-.03],[-.21,.03,-.03],[.09,0,0],[-.09,0,0],[.10,.40,0],[-.10,.40,0],[.10,.80,0],[-.10,.80,0],[.10,.84,.04],[-.10,.84,.04],[.11,.86,-.10],[-.11,.86,-.10]];
function handT(s){const p=[0,0,0],bx=[-.04,-.02,0,.02,.036],len=[[.02,.03,.025,.02],[.09,.04,.025,.02],[.095,.045,.028,.02],[.09,.04,.025,.02],[.08,.03,.02,.016]];
  for(let f=0;f<5;f++){let y=0,z=0;for(let k=0;k<4;k++){y+=len[f][k];z-=k*.006;p.push(bx[f]*s,y,z)}}return p}
const HT=[handT(1),handT(-1)];
const BODY=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[27,31],[28,30],[30,32],[28,32]];
const HEAD=[[7,0],[8,0],[1,2],[2,3],[4,5],[5,6],[9,10],[7,8]];
const HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

// ---- テンプレ⇔検出のなめらかな合成 ----
const st=()=>({w:0,h:null});
const bodyS=Array.from({length:33},st),handS=[st(),st()],headS=st();
const ez=w=>w*w*(3-2*w);
function track(s,seen,det,dt){
  if(seen){
    if(!s.h)s.h=Array.from(det);else{const k=1-Math.exp(-FOLLOW*dt);for(let i=0;i<det.length;i++)s.h[i]+=(det[i]-s.h[i])*k}
    s.w+=(1-s.w)*(1-Math.exp(-RISE*dt));
  }else s.w=Math.max(0,s.w-FALL*dt);
}
function out(s,tpl){const e=ez(s.w);return tpl.map((t,i)=>s.h&&e>0?t+(s.h[i]-t)*e:t)}
const rotM=(a,b,c)=>{const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cc=Math.cos(c),sc=Math.sin(c);
  return[[ca*cc+sa*sb*sc,-ca*sc+sa*sb*cc,sa*cb],[cb*sc,cb*cc,-sb],[-sa*cc+ca*sb*sc,sa*sc+ca*sb*cc,ca*cb]]};
const mv=(R,o)=>[R[0][0]*o[0]+R[0][1]*o[1]+R[0][2]*o[2],R[1][0]*o[0]+R[1][1]*o[1]+R[1][2]*o[2],R[2][0]*o[0]+R[2][1]*o[1]+R[2][2]*o[2]];
const ang=(a,b,c)=>{const u=[a[0]-b[0],a[1]-b[1],a[2]-b[2]],v=[c[0]-b[0],c[1]-b[1],c[2]-b[2]];
  const d=u[0]*v[0]+u[1]*v[1]+u[2]*v[2],m=Math.hypot(...u)*Math.hypot(...v);
  return m?Math.round(Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI)+"°":"–"};
const inside=p=>(p.visibility??1)>.5&&p.x>.01&&p.x<.99&&p.y>.01&&p.y<.99;

// 検出された手を、近い手首(左=15/右=16)に割り当てる
function assign(hs,L){
  const r=[-1,-1];if(!hs||!hs.length||!L)return r;
  const d=(h,j)=>Math.hypot(hs[h][0].x-L[j].x,hs[h][0].y-L[j].y);
  if(hs.length===1){const a=d(0,15),b=d(0,16);if(Math.min(a,b)<.25)r[a<b?0:1]=0}
  else if(d(0,15)+d(1,16)<=d(1,15)+d(0,16)){r[0]=0;r[1]=1}else{r[0]=1;r[1]=0}
  return r;
}

// ---- 脚の後処理(信頼度重み・左右ID維持・カルマン予測・骨長補正) ----
// 検出後の座標だけを加工する層。ランドマーク定義(25-32)と出力形式は従来どおり。
const LJ=[25,27,29,31];                 // 膝・足首・かかと・つま先(左脚。右脚は+1)
const Q=300,R0=.0009,CMIN=.3,HIDE=1,DAMP=3,REC=.25;
// Q:加速度ノイズ(大きいほど素早く追従) R0:信頼度1での観測ノイズ CMIN:これ未満は観測として使わない
// HIDE:予測を続ける最大秒数(超えるとテンプレへ戻る) DAMP:隠れ中の速度減衰(1/秒) REC:再認識の復帰秒数
class KF{ // 1軸の等速モデル・カルマンフィルタ(状態=位置,速度)
  constructor(){this.p=0;this.v=0;this.a=1;this.b=0;this.c=1}
  init(z){this.p=z;this.v=0;this.a=.01;this.b=0;this.c=1}
  predict(dt,q){this.p+=this.v*dt;this.a+=dt*(2*this.b+dt*this.c)+q*dt*dt*dt/3;this.b+=dt*this.c+q*dt*dt/2;this.c+=q*dt}
  update(z,r){const S=this.a+r,k0=this.a/S,k1=this.b/S,y=z-this.p,b0=this.b;this.p+=k0*y;this.v+=k1*y;this.a-=k0*this.a;this.b-=k0*b0;this.c-=k1*b0}
}
const lg=[0,1].map(()=>LJ.map(()=>({k:[new KF(),new KF(),new KF()],init:false,hid:9,rec:1})));
let lgMap=0,lgEv=0,prevB=T;
const lenE=[.40,.40,.06,.12];           // 骨長の推定値[大腿,下腿,足首-かかと,足首-つま先]
const d3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const clampLen=(p,o,len,tol=.15)=>{const d=[p[0]-o[0],p[1]-o[1],p[2]-o[2]],n=Math.hypot(...d);if(!n)return p;const m=Math.min(len*(1+tol),Math.max(len*(1-tol),n));return m===n?p:[o[0]+d[0]*m/n,o[1]+d[1]*m/n,o[2]+d[2]*m/n]};
function legFilter(L,W,dt){
  const conf=i=>{const p=L&&L[i];if(!p||p.x<.01||p.x>.99||p.y<.01||p.y>.99)return 0;return(p.visibility??1)*(p.presence??1)};
  const hip=[0,1].map(t=>L&&inside(L[23+t])?[W[23+t].x,W[23+t].y,W[23+t].z]:prevB[23+t]);
  // 1) 予測(隠れている間は速度を減衰)
  for(const t of[0,1])for(const m of lg[t])for(const f of m.k){f.predict(dt,Q);if(m.hid>0)f.v*=Math.exp(-DAMP*dt)}
  // 2) 検出(画面上の左右ラベル k=0:左脚 1:右脚)
  const det=[0,1].map(k=>LJ.map(b=>{const i=b+k,c=W?conf(i):0;return{c,z:c>0?[W[i].x,W[i].y,W[i].z]:null}}));
  const pr=(t,j)=>lg[t][j].k.map(f=>f.p);
  const cost=(t,k)=>{let s=0,w=0;
    for(let j=0;j<2;j++){const e=det[k][j];if(e.c<CMIN||!lg[t][j].init)continue;
      s+=e.c*d3(pr(t,j),e.z);w+=e.c;
      if(j===0){s+=e.c*.5*Math.abs(d3(e.z,hip[t])-lenE[0]);w+=e.c*.5}}   // 膝-股関節の距離も加味
    return w?s/w:null};
  // 3) 左右ID維持:予測位置(位置+速度)との連続性で対応付け。2フレーム連続で明確に入れ替えが有利なときだけ切替
  let ev=false;
  if(lg[0][0].init&&lg[1][0].init){
    let cur=0,alt=0,n=0;
    for(const k of[0,1]){const a=cost(k^lgMap,k),b=cost(k^lgMap^1,k);if(a!=null&&b!=null){cur+=a;alt+=b;n++}}
    if(n&&alt<cur*.6&&cur-alt>.08*n)ev=true;
  }
  lgEv=ev?lgEv+1:0;if(lgEv>=2){lgMap^=1;lgEv=0}
  // 4) 観測更新:信頼度で重み付け、予測から外れた値は抑制、再認識は滑らかに復帰
  for(const t of[0,1])for(let j=0;j<4;j++){
    const m=lg[t][j],e=det[t^lgMap][j];
    if(e.c>=CMIN){
      if(!m.init){m.k.forEach((f,a)=>f.init(e.z[a]));m.init=true;m.hid=0;m.rec=1}
      else{
        const pz=m.k.map(f=>f.p),g=1/(1+(d3(pz,e.z)/(.3+.8*Math.min(m.hid,HIDE)))**2);
        if(m.hid>.2)m.rec=0;
        m.rec=Math.min(1,m.rec+dt/REC);
        const q=ez(m.rec),cc=Math.max(.05,e.c*g);
        m.k.forEach((f,a)=>f.update(pz[a]+(e.z[a]-pz[a])*q,R0/(cc*cc)));
        m.hid=0;
      }
    }else m.hid+=dt;
  }
  // 5) 骨長の推定更新(高信頼のときだけ緩やかに)+脚の構造補正(交差は妨げない)
  const res={};
  for(const t of[0,1]){
    const e=det[t^lgMap],M=lg[t],hc=conf(23+t)>.7;
    const up=(n,A,B)=>{const d=d3(A,B);if(n<2?(d>.2&&d<.6):(d>.02&&d<.3))lenE[n]+=(d-lenE[n])*.03};
    if(hc&&e[0].c>.7)up(0,hip[t],e[0].z);
    if(e[0].c>.7&&e[1].c>.7)up(1,e[0].z,e[1].z);
    if(e[1].c>.7&&e[2].c>.7)up(2,e[1].z,e[2].z);
    if(e[1].c>.7&&e[3].c>.7)up(3,e[1].z,e[3].z);
    if(M[0].init&&M[1].init){
      const P=M.map(m=>m.k.map(f=>f.p));
      P[0]=clampLen(P[0],hip[t],lenE[0]);
      P[1]=clampLen(P[1],P[0],lenE[1]);
      P[2]=clampLen(P[2],P[1],lenE[2],.5);
      P[3]=clampLen(P[3],P[1],lenE[3],.5);
      P.forEach((p,j)=>{if(M[j].init)M[j].k.forEach((f,a)=>f.p=p[a])});
    }
    M.forEach((m,j)=>{res[LJ[j]+t]={seen:m.init&&m.hid<HIDE,det:m.k.map(f=>f.p)}});
  }
  return res;
}

async function loadModel(){
  status("モデル読み込み中…");
  const V="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14",G="https://storage.googleapis.com/mediapipe-models/";
  const fs=await FilesetResolver.forVisionTasks(V+"/wasm");
  const mk=async(C,p,o)=>{for(const d of["GPU","CPU"]){try{return await C.createFromOptions(fs,{baseOptions:{modelAssetPath:G+p,delegate:d},runningMode:"VIDEO",...o})}catch(e){}}return null};
  pose=await mk(PoseLandmarker,"pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",{numPoses:1});
  if(!pose)throw new Error("姿勢モデルを読み込めません");
  handM=await mk(HandLandmarker,"hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",{numHands:2});
  faceM=await mk(FaceLandmarker,"face_landmarker/face_landmarker/float16/1/face_landmarker.task",{numFaces:1,outputFacialTransformationMatrixes:true});
}
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:960},height:{ideal:1280}},audio:false});
  vid.srcObject=stream;await vid.play();
  const m=facing==="user";vid.classList.toggle("mirror",m);ov.classList.toggle("mirror",m);vc.classList.toggle("mirror",m);
}
$("go").onclick=async()=>{
  try{
    if(!pose)await loadModel();
    await startCam();
    if(!running){running=true;last=performance.now();loop()}
    status("トラッキング中"+(handM?"":"(手なし)")+(faceM?"":"(顔なし)"));$("go").textContent="再開始";
  }catch(e){status("エラー: "+(e.message||e)+"(カメラ許可/ネットワークを確認)")}
};
$("flip").onclick=async()=>{facing=facing==="user"?"environment":"user";if(stream)try{await startCam()}catch(e){status("切替失敗")}};

// ---- VRM重ね合わせ(three / three-vrm は読み込み時に動的取得。失敗しても本体は動く) ----
const vc=$("vc");let vx=null;
$("dim").onchange=()=>{vid.style.opacity=$("dim").checked?.25:1};
const FG=[["Thumb",["Metacarpal","Proximal","Distal"],1],["Index",["Proximal","Intermediate","Distal"],5],["Middle",["Proximal","Intermediate","Distal"],9],["Ring",["Proximal","Intermediate","Distal"],13],["Little",["Proximal","Intermediate","Distal"],17]];
// 各ボーンの「待機方向」(子ボーンの局所位置)と「狙う方向(2点)」の対応表
function buildDrive(hn,TH){
  const Dv=[],V=(a,i)=>new TH.Vector3(a[i][0],-a[i][1],-a[i][2]);
  const add=(n,c,f)=>{const a=hn(n);if(!a)return;const b=c&&hn(c);if(!b&&/Foot$/.test(n))return;Dv.push({a,r:(b?b.position:a.position).clone().normalize(),f})};
  for(const s of[0,1]){
    const p=s?"right":"left",sh=11+s,el=13+s,wr=15+s,hp=23+s,kn=25+s,an=27+s,to=31+s;
    add(p+"UpperArm",p+"LowerArm",S=>[V(S.B,sh),V(S.B,el)]);
    add(p+"LowerArm",p+"Hand",S=>[V(S.B,el),V(S.B,wr)]);
    add(p+"Hand",p+"MiddleProximal",S=>[V(S.hands[s],0),V(S.hands[s],9)]);
    for(const[g,nm,st]of FG)nm.forEach((x,j)=>add(p+g+x,nm[j+1]&&p+g+nm[j+1],S=>[V(S.hands[s],st+j),V(S.hands[s],st+j+1)]));
    add(p+"UpperLeg",p+"LowerLeg",S=>[V(S.B,hp),V(S.B,kn)]);
    add(p+"LowerLeg",p+"Foot",S=>[V(S.B,kn),V(S.B,an)]);
    add(p+"Foot",p+"Toes",S=>[V(S.B,an),V(S.B,to)]);
  }
  return Dv;
}
$("vf").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    status("VRM読み込み中…");
    const[TH,{GLTFLoader},VR]=await Promise.all([import("three"),import("three/addons/loaders/GLTFLoader.js"),import("@pixiv/three-vrm")]);
    const buf=await f.arrayBuffer(),ld=new GLTFLoader();ld.register(p=>new VR.VRMLoaderPlugin(p));
    const gltf=await new Promise((ok,ng)=>ld.parse(buf,"",ok,ng));
    const vrm=gltf.userData.vrm;if(!vrm)throw new Error("VRM形式ではありません");
    VR.VRMUtils.rotateVRM0(vrm);
    if(!vx){
      const renderer=new TH.WebGLRenderer({canvas:vc,alpha:true,antialias:true});renderer.setClearColor(0x000000,0);
      const scene=new TH.Scene(),dl=new TH.DirectionalLight(0xffffff,Math.PI);dl.position.set(.5,1,1.5);
      scene.add(dl,new TH.AmbientLight(0xffffff,.6));
      vx={TH,renderer,scene,cam:new TH.OrthographicCamera(0,1,1,0,-5000,5000),k:0,pos:null,w:0,h:0};
    }
    if(vx.vrm)vx.scene.remove(vx.vrm.scene);
    vx.scene.add(vrm.scene);vrm.scene.updateMatrixWorld(true);
    const hn=n=>vrm.humanoid.getNormalizedBoneNode(n),hips=hn("hips");
    Object.assign(vx,{vrm,hn,hips,rigRoot:hips.parent,hipR:hips.getWorldPosition(new TH.Vector3()),drv:null});
    vx.rigQ=hips.parent.getWorldQuaternion(new TH.Quaternion());
    vx.drv=buildDrive(hn,TH);
    vc.hidden=false;status("VRM読み込み完了");
  }catch(err){status("VRMエラー: "+(err.message||err))}
};
// 安定化済みの骨格(B)・指(hands)・顔の向き(HR)からVRMのボーン回転を作り、映像と同じ座標で描画
function vrmFrame(S){
  if(!vx||!vx.drv)return;
  const{TH,vrm,rigQ,rigRoot,hips}=vx,vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return;
  if(vx.w!==vw||vx.h!==vh){const q=Math.min(1,720/Math.max(vw,vh));vx.renderer.setSize(Math.round(vw*q),Math.round(vh*q),false);
    Object.assign(vx.cam,{left:0,right:vw,top:vh,bottom:0});vx.cam.updateProjectionMatrix();vx.w=vw;vx.h=vh}
  const{B,L,W,HR}=S,V=a=>new TH.Vector3(a[0],-a[1],-a[2]);
  // 位置とスケール(映像のピクセル座標に合わせる)
  const sIn=L&&inside(L[11])&&inside(L[12]),hIn=L&&inside(L[23])&&inside(L[24]);
  const mid=(i,j)=>[(L[i].x+L[j].x)/2*vw,(L[i].y+L[j].y)/2*vh];
  if(sIn&&hIn){const a=mid(11,12),b=mid(23,24),wd=Math.hypot((W[11].x+W[12].x-W[23].x-W[24].x)/2,(W[11].y+W[12].y-W[23].y-W[24].y)/2);
    if(wd>.15){const est=Math.hypot(a[0]-b[0],a[1]-b[1])/wd;vx.k=vx.k?vx.k+(est-vx.k)*.1:est}}
  const k=vx.k||vh/2;let tg=null;
  if(sIn){const a=mid(11,12);tg=[a[0]+k*((B[23][0]+B[24][0])/2-(B[11][0]+B[12][0])/2),a[1]+k*((B[23][1]+B[24][1])/2-(B[11][1]+B[12][1])/2)]}
  else if(hIn)tg=mid(23,24);
  if(tg){if(vx.pos){const f=1-Math.exp(-25*S.dt);vx.pos=[vx.pos[0]+(tg[0]-vx.pos[0])*f,vx.pos[1]+(tg[1]-vx.pos[1])*f]}else vx.pos=tg}
  if(!vx.pos)return;
  const sc=vrm.scene;sc.scale.setScalar(k);sc.position.set(vx.pos[0]-k*vx.hipR.x,vh-vx.pos[1]-k*vx.hipR.y,0);
  // ボーン回転:ワールド姿勢を求め、親の姿勢を引いて局所回転にする
  const wq=new Map(),wo=n=>!n||n===rigRoot?rigQ:(wq.get(n)||wo(n.parent));
  const setW=(node,nw)=>{node.quaternion.copy(wo(node.parent).clone().invert().multiply(nw));wq.set(node,nw)};
  const xa=V(B[23]).sub(V(B[24])).normalize(),sh=V(B[11]).add(V(B[12])).multiplyScalar(.5),hp=V(B[23]).add(V(B[24])).multiplyScalar(.5);
  const ya=sh.sub(hp).normalize(),za=new TH.Vector3().crossVectors(xa,ya).normalize(),xo=new TH.Vector3().crossVectors(ya,za);
  setW(hips,new TH.Quaternion().setFromRotationMatrix(new TH.Matrix4().makeBasis(xo,ya,za)).multiply(rigQ));
  const Dm=[1,-1,-1],e=[];for(let i=0;i<3;i++){for(let j=0;j<3;j++)e.push(Dm[i]*Dm[j]*HR[i][j]);e.push(0)}
  const head=vx.hn("head");
  if(head)setW(head,new TH.Quaternion().setFromRotationMatrix(new TH.Matrix4().set(...e,0,0,0,1)).multiply(rigQ));
  for(const d of vx.drv){
    const[p0,p1]=d.f(S),v=p1.sub(p0);if(v.lengthSq()<1e-6)continue;v.normalize();
    setW(d.a,new TH.Quaternion().setFromUnitVectors(d.r.clone().applyQuaternion(rigQ),v).multiply(rigQ));
  }
  vrm.update(S.dt);vx.renderer.render(vx.scene,vx.cam);
}

function loop(){
  requestAnimationFrame(loop);
  if(!pose||vid.readyState<2||vid.paused)return;
  const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
  fps=fps*.9+(1/Math.max(dt,.001))*.1;$("fps").textContent=fps.toFixed(0);
  if(ov.width!==vid.videoWidth){ov.width=vid.videoWidth;ov.height=vid.videoHeight}
  const pr=pose.detectForVideo(vid,now);n++;
  if(n%2===0&&handM)handR=handM.detectForVideo(vid,now);
  else if(n%2===1&&faceM)faceR=faceM.detectForVideo(vid,now);
  const L=pr.landmarks[0],W=pr.worldLandmarks[0];

  // 体:各関節ごとに「見えていれば反映、見えなければテンプレへ戻る」
  let vis=0;
  const LG=legFilter(L,W,dt);   // 脚(25-32)のみ後処理済みの座標に差し替え
  for(let i=0;i<33;i++){const raw=!!(L&&inside(L[i]));if(raw)vis++;
    const g=LG[i];track(bodyS[i],g?g.seen:raw,g?g.det:(raw?[W[i].x,W[i].y,W[i].z]:null),dt)}
  const B=bodyS.map((s,i)=>out(s,T[i]));prevB=B;

  // 顔の向き(顔の変換行列から回転を取り出す)
  const fm=faceR&&faceR.facialTransformationMatrixes&&faceR.facialTransformationMatrixes[0];
  let fs=false,fa=null;
  if(fm&&faceR.faceLandmarks.length){
    const d=fm.data,D=[1,-1,-1],R=(i,j)=>D[i]*D[j]*d[j*4+i];
    fa=[Math.atan2(R(0,2),R(2,2)),Math.atan2(-R(1,2),Math.hypot(R(0,2),R(2,2))),Math.atan2(R(1,0),R(1,1))];fs=true;
  }
  track(headS,fs,fa,dt);
  const ha=out(headS,[0,0,0]),HR=rotM(ha[0],ha[1],ha[2]);
  const C=[0,1,2].map(k=>(B[7][k]+B[8][k])/2);
  const hp=T.slice(0,11).map(t=>{const o=mv(HR,[t[0],t[1]+.66,t[2]-.02]);return[C[0]+o[0],C[1]+o[1],C[2]+o[2]]});
  ["fy","fp","fr"].forEach((id,i)=>$(id).textContent=Math.round(ha[i]*180/Math.PI)+"°");

  // 手指
  const as=assign(handR&&handR.landmarks,L),hands=[],seenH=[];
  for(let k=0;k<2;k++){
    const idx=as[k],wl=idx>=0&&handR.worldLandmarks[idx];let det=null;
    if(wl){det=[];for(const p of wl)det.push(p.x-wl[0].x,p.y-wl[0].y,p.z-wl[0].z)}
    track(handS[k],!!det,det,dt);seenH.push(!!det);
    const r=out(handS[k],HT[k]),w=B[15+k],P=[];
    for(let j=0;j<21;j++)P.push([w[0]+r[j*3],w[1]+r[j*3+1],w[2]+r[j*3+2]]);
    hands.push(P);
  }
  $("hd").textContent=(seenH[0]?"左":"–")+(seenH[1]?"右":"–");
  $("cnt").textContent=vis+"/33";
  $("a0").textContent=ang(B[11],B[13],B[15]);$("a1").textContent=ang(B[12],B[14],B[16]);
  $("a2").textContent=ang(B[23],B[25],B[27]);$("a3").textContent=ang(B[24],B[26],B[28]);

  $("sk").checked?drawOverlay(L,handR&&handR.landmarks):ctx.clearRect(0,0,ov.width,ov.height);
  draw3d({B,hp,C,hands});
  vrmFrame({B,hands,HR,L,W,dt});
}

// カメラ映像上には「生の検出結果」だけを表示
function drawOverlay(L,hs){
  ctx.clearRect(0,0,ov.width,ov.height);
  const X=p=>p.x*ov.width,Y=p=>p.y*ov.height;
  ctx.lineWidth=Math.max(3,ov.width/200);ctx.lineCap="round";
  if(L){ctx.strokeStyle="#00e0a0";ctx.beginPath();
    for(const[a,b]of BODY){if(!inside(L[a])||!inside(L[b]))continue;ctx.moveTo(X(L[a]),Y(L[a]));ctx.lineTo(X(L[b]),Y(L[b]))}ctx.stroke()}
  if(hs)for(const h of hs){ctx.strokeStyle="#ff9f0a";ctx.lineWidth=Math.max(2,ov.width/320);ctx.beginPath();
    for(const[a,b]of HC){ctx.moveTo(X(h[a]),Y(h[a]));ctx.lineTo(X(h[b]),Y(h[b]))}ctx.stroke()}
}

// 安定化したアバターを3D表示
function draw3d(S){
  const r=devicePixelRatio||1,w=v3.clientWidth,h=v3.clientHeight;
  if(v3.width!==Math.round(w*r)){v3.width=Math.round(w*r);v3.height=Math.round(h*r)}
  c3.setTransform(r,0,0,r,0,0);c3.clearRect(0,0,w,h);c3.lineCap="round";
  const th=$("yaw").value*Math.PI/180,cs=Math.cos(th),sn=Math.sin(th),s=h*.5,m=$("mir").checked?-1:1;
  const pj=p=>[w/2+(p[0]*m*cs+p[2]*sn)*s,h/2+(p[1]-.08)*s];
  const seg=(P,pairs,col,lw)=>{c3.strokeStyle=col;c3.lineWidth=lw;c3.beginPath();for(const[a,b]of pairs){const A=pj(P[a]),Bq=pj(P[b]);c3.moveTo(A[0],A[1]);c3.lineTo(Bq[0],Bq[1])}c3.stroke()};
  const dots=(P,idx,col,rad)=>{c3.fillStyle=col;for(const i of idx){const A=pj(P[i]);c3.beginPath();c3.arc(A[0],A[1],rad,0,7);c3.fill()}};
  seg(S.B,BODY,"#0a84ff",4);
  dots(S.B,[11,12,13,14,15,16,23,24,25,26,27,28],"#ff4d6d",4);
  const N=[0,1,2].map(k=>(S.B[11][k]+S.B[12][k])/2);
  seg([S.C,N],[[0,1]],"#0a84ff",4);
  seg(S.hp,HEAD,"#0a84ff",2.5);dots(S.hp,[0],"#ff4d6d",3.5);
  const A=pj(S.C);c3.strokeStyle="#0a84ff";c3.lineWidth=2;c3.beginPath();c3.arc(A[0],A[1],.11*s,0,7);c3.stroke();
  for(const P of S.hands){seg(P,HC,"#ff9f0a",2.5);dots(P,[...Array(21).keys()],"#ffd60a",2)}
}
</script>
